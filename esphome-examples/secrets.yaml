# ESPHome Secrets Configuration
# This file contains sensitive credentials used by ESPHome device configurations
# Keep this file secure and do not commit it to version control

# WiFi Configuration
wifi_ssid: "YourWiFiSSID"
wifi_password: "YourWiFiPassword"

# Fallback AP (Access Point) Password
# Used when device cannot connect to primary WiFi
ap_password: "FallbackAP123"

# MQTT Broker Configuration
mqtt_broker_address: "homeassistant.local"  # or IP address like "192.168.1.100"
mqtt_username: "mqtt-user"
mqtt_password: "mqtt-password"

# Home Assistant API Encryption Key
# Generate with: esphome run device.yaml (it will auto-generate)
# Or use: openssl rand -base64 32
api_encryption_key: "your-32-character-base64-key-here="

# OTA Service Configuration
ota_password: "the-ota-password"  # Must match OTA service config
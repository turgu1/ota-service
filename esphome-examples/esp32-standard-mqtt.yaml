# ESPHome Configuration Example - Standard Device (No Deep Sleep)
# This example shows all required components to work with the OTA service
# through MQTT.
# Device will remain online continuously and respond immediately to OTA requests

substitutions:
  device_name: esp32-outdoor-sensor
  friendly_name: "Outdoor Sensor"
  firmware_version: "1.0.0"  # Update this when deploying new firmware

  # OTA service related substitutions
  ota_service_name: "ota-service" # from OTA service config
  ota_password: "the-ota-password"  # Must match OTA service config
  ota_port: "3232"  # ESPHome OTA port (default: 3232)

  # MQTT related substitutions
  mqtt_port: "1883"  # 8883 for TLS
  devices_prefix: "devices/"

  # IMPORTANT:
  # If the device uses a static IP, set it here.
  # If not, be sure that your DHCP lease time is long enough to avoid IP changes,
  # or make it's address reservation in your DHCP Config.
  # -->
  # ip_address: "10.0.0.253"
  # gateway_address: "10.0.0.1"
  # subnet_mask: "255.255.255.0"

esphome:
  name: ${device_name}
  on_boot:
    priority: -100  # Run after WiFi and MQTT are connected
    then:
      - delay: 500s  # Wait for MQTT connection to stabilize
      - script.execute: register_device_to_ota_service

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# WiFi configuration
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the device IP address is static, set it here
  # manual_ip: 
  #   static_ip: $ip_address
  #   gateway: $gateway_address
  #   subnet: $subnet_mask
  
  # Fast connect for battery devices
  fast_connect: true
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Enable logging (reduce level to save power)
logger:
  level: INFO

# Enable OTA updates via ESPHome protocol v2
# Critical for OTA service integration
ota:
  - platform: esphome
    password: !secret ota_password
    port: ${ota_port}

# MQTT configuration - REQUIRED for OTA service integration
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker_address
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  
  keepalive: 60s
  
  on_connect:
    then:
      - delay: 500ms
      - script.execute: check_for_ota # <-- Check for OTA updates upon MQTT connection

script:
  - id: register_device_to_ota_service
    then:
      - wait_until:
          mqtt.connected:
      - delay: 500ms
      - lambda: |-
          std::string device_id = esphome::App.get_name();
          id(mqtt_client).publish_json("${ota_service_name}/register", [=](JsonObject root) {
            root["device_id"] = device_id.c_str(); 
            root["ip_address"] = id(wifi_component).get_use_address();
            root["mac_address"] = get_mac_address_pretty();
            root["firmware_version"] = "${firmware_version}";
            root["ota_readiness_topic"] = "${devices_prefix}" + device_id + "/ota-ready";
            root["ota_mode_topic"] = "${devices_prefix}" + device_id + "/ota-mode";
            root["uses_deep_sleep"] = true;
            root["rssi"] = id(wifi_component).wifi_rssi();
          }, false, 1);

  - id: check_for_ota
    then:
      - lambda: |-
          std::string device_id = esphome::App.get_name();
          id(mqtt_client).subscribe("${devices_prefix}" + device_id + "/ota-mode",  
            [=](const std::string &topic, const std::string &payload) {
              if (payload == "NEW-FIRMWARE-VERSION") {
                id(deep_sleep_control).prevent_deep_sleep();
                id(ota_update) = true;
                id(mqtt_client).publish("${devices_prefix}" + device_id + "/ota-ready", "OTA-READY", 9, 2, false);
              }
            },1);
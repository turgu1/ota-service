# ESPHome Configuration Example - Standard Device (No Deep Sleep)
# This example shows all required components to work with the OTA service
# Device will remain online continuously and respond immediately to OTA requests

substitutions:
  device_name: esp32-outdoor-sensor
  device_id: esp32-outdoor-sensor
  friendly_name: "Outdoor Sensor"
  firmware_version: "1.0.0"  # Update this when deploying new firmware

  # OTA service related substitutions
  ota_service_name: "ota-service" # from OTA service config
  ota_password: "the-ota-password"  # Must match OTA service config
  ota_port: "3232"  # ESPHome OTA port (default: 3232)

  # MQTT related substitutions
  mqtt_port: "1883"  # 8883 for TLS
  topic_prefix: "devices/${device_id}"

  # IMPORTANT:
  # If the device uses a static IP, set it here.
  # If not, be sure that your DHCP lease time is long enough to avoid IP changes,
  # or make it's address reservation in your DHCP Config.
  # -->
  # ip_address: "10.0.0.253"
  # gateway_address: "10.0.0.1"
  # subnet_mask: "255.255.255.0"

esphome:
  name: ${device_name}
  on_boot:
    priority: -100  # Run after WiFi and MQTT are connected
    then:
      - delay: 1s  # Wait for MQTT connection to stabilize
      - script.execute: register_device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the device IP address is static, set it here
  # manual_ip: 
  #   static_ip: $ip_address
  #   gateway: $gateway_address
  #   subnet: $subnet_mask
  
  # Fast connect for battery devices
  fast_connect: true
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Text sensor for IP address.
text_sensor:
  - platform: wifi_info
    ip_address:
      id: device_ip
  - platform: wifi_info
    mac_address:
      id: wifi_mac_address

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 60s

# Enable logging (reduce level to save power)
logger:
  level: INFO

# Enable OTA updates via ESPHome protocol v2
# Critical for OTA service integration
ota:
  - platform: esphome
    password: !secret ota_password
    port: ${ota_port}

# MQTT configuration - REQUIRED for OTA service integration
mqtt:
  broker: !secret mqtt_broker_address
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  client_id: ${device_id}
  
  keepalive: 60s
  
  # Subscribe to OTA mode topic
  on_message:
    - topic: ${topic_prefix}/ota-mode
      payload: 'NEW-FIRMWARE-VERSION'
      then:
        - logger.log: "Received a NEW-FIRMWARE-VERSION OTA mode message"
        - logger.log: "Preparing for OTA update"
        - mqtt.publish:
            topic: ${topic_prefix}/ota-ready
            payload: "OTA-READY"
            retain: false
            qos: 1

        # Optional: Turn off sensors or close connections if needed
        # The device will receive firmware upload shortly

script:
  - id: register_device
    then:
      - wait_until:
          mqtt.connected:
      - delay: 500ms
      - mqtt.publish_json: 
          topic: "${ota_service_name}/register"
          payload: |-
            root["device_id"] = "${device_id}"; 
            root["ip_address"] = id(device_ip).state.c_str();
            root["mac_address"] = id(wifi_mac_address).state.c_str();
            root["firmware_version"] = "${firmware_version}";
            root["ota_readiness_topic"] = "${topic_prefix}/ota-ready";
            root["ota_mode_topic"] = "${topic_prefix}/ota-mode";
            root["uses_deep_sleep"] = false;
            root["rssi"] = id(wifi_rssi).state;
          retain: false # Important: do *NOT* retain registration messages
          qos: 1
      - delay: 1s
      - logger.log: "Device registered with OTA service"


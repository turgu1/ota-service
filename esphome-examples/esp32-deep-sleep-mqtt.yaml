# ESPHome Configuration Example - Deep Sleep Device (Battery Powered)
# This example shows how to integrate deep sleep devices with the OTA service
# through MQTT.
# Device wakes periodically, checks for OTA updates, and goes back to sleep

substitutions:
  device_name: esp32-outdoor-sensor
  friendly_name: "Outdoor Sensor"
  firmware_version: "1.0.0"  # Update this when deploying new firmware

  # OTA service related substitutions
  ota_service_name: "ota-service" # from OTA service config
  ota_password: "the-ota-password"  # Must match OTA service config
  ota_port: "3232"  # ESPHome OTA port

  # MQTT related substitutions
  mqtt_port: "1883"  # 8883 for TLS
  devices_prefix: "devices/"

  # Deep sleep timings
  sleep_duration: "300s"  # Sleep for xx seconds between wakeups
  run_duration: "30s"  # Stay awake for 30 seconds (enough for sensor readings and OTA check)

  # IMPORTANT:
  # If the device uses a static IP, set it here.
  # If not, be sure that your DHCP lease time is long enough to avoid IP changes,
  # or make it's address reservation in your DHCP Config.
  # -->
  # ip_address: "10.0.0.253"
  # gateway_address: "10.0.0.1"
  # subnet_mask: "255.255.255.0"

esphome:
  name: ${device_name}
  
  on_boot:
    priority: -100
    then:
      # Register device only if not waking from deep sleep
      - if:
          condition:
            lambda: "return esp_reset_reason() != ESP_RST_DEEPSLEEP;"
          then:
            - script.execute: register_device_to_ota_service

  project:
    name: "home.outdoor-sensor"
    version: "${firmware_version}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# WiFi configuration
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the device IP address is static, set it here
  # manual_ip: 
  #   static_ip: $ip_address
  #   gateway: $gateway_address
  #   subnet: $subnet_mask
  
  # Fast connect for battery devices
  fast_connect: true
  
  # Power save mode
  power_save_mode: LIGHT
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Enable logging (reduce level to save power)
logger:
  level: INFO

# Deep sleep control
deep_sleep:
  id: deep_sleep_control
  run_duration: ${run_duration} 
  sleep_duration: ${sleep_duration}

# This will checked automatically to see if we can enter deep sleep
# this could be adapted to include other conditions as needed
binary_sensor:
  - platform: template
    id: "ready_for_deep_sleep"
    lambda: |-
      return id(mqtt_work_is_complete) && !id(ota_update);
    on_state_change:
      then:
        - if:
            condition:
              binary_sensor.is_on: ready_for_deep_sleep
            then:
              - deep_sleep.enter: deep_sleep_control

# Global variable to track if we're waiting for OTA
globals:
  - id: mqtt_work_is_complete  # True if all MQTT related work is completed
    type: bool
    initial_value: 'false'
  - id: ota_update            # True if an OTA update is in progress
    type: bool                # Set when a NEW-FIRMWARE-VERSION msg is received
    initial_value: 'false'

# Enable OTA updates via ESPHome protocol v2
# Critical for OTA service integration
ota:
  - platform: esphome
    password: !secret ota_password
    port: ${ota_port}
    on_error:
      then:
        - globals.set:
            id: ota_update
            value: 'false'

# MQTT configuration - REQUIRED for OTA service integration
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker_address
  port: ${mqtt_port}
  username: !secret mqtt_username
  password: !secret mqtt_password
  
  # Keep alive should be shorter for deep sleep devices
  keepalive: 15s

  on_connect:
    then:
      - delay: 500ms
      - script.execute: check_for_ota # <-- Check for OTA updates upon MQTT connection

      # Do here some of the transmissions needed
      # e.g. publish sensor states, etc.
      # For this example, we just wait a bit to simulate work

      - delay: 2s
      - globals.set:
          id: mqtt_work_is_complete
          value: 'true'

script:
  - id: register_device_to_ota_service
    then:
      - wait_until:
          mqtt.connected:
      - delay: 500ms
      - lambda: |-
          std::string device_id = esphome::App.get_name();
          id(mqtt_client).publish_json("${ota_service_name}/register", [=](JsonObject root) {
            root["device_id"] = device_id.c_str(); 
            root["ip_address"] = id(wifi_component).get_use_address();
            root["mac_address"] = get_mac_address_pretty();
            root["firmware_version"] = "${firmware_version}";
            root["ota_readiness_topic"] = "${devices_prefix}" + device_id + "/ota-ready";
            root["ota_mode_topic"] = "${devices_prefix}" + device_id + "/ota-mode";
            root["uses_deep_sleep"] = true;
            root["rssi"] = id(wifi_component).wifi_rssi();
          }, false, 1);

  - id: check_for_ota
    then:
      - lambda: |-
          std::string device_id = esphome::App.get_name();
          id(mqtt_client).subscribe("${devices_prefix}" + device_id + "/ota-mode",  
            [=](const std::string &topic, const std::string &payload) {
              if (payload == "NEW-FIRMWARE-VERSION") {
                id(deep_sleep_control).prevent_deep_sleep();
                id(ota_update) = true;
                id(mqtt_client).publish("${devices_prefix}" + device_id + "/ota-ready", "OTA-READY", 9, 2, false);
              }
            },1);

